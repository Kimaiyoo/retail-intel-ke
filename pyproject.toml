[project]
name = "retail-intel-ke"
version = "0.1.0"
description = "Real-time market intelligence platform benchmarking enterprise retail performance against national commodity prices."
readme = "README.md"
authors = [
    { name = "Kimaiyoo", email = "naomijepkorir18@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "apache-airflow>=3.3.2",
    "confluent-kafka>=2.16.0",
    "faker>=40.43.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.14.1",
    "pyspark>=4.2.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.5",
]

[project.scripts]
retail-intel-ke = "retail_intel_ke:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.17.0",
    "ruff>=0.17.1",
]
